<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Día 10 – Juego del Papá Noel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0b1320;
      color: #fff;
      padding: 20px 10px;
      gap: 20px;
    }

    header h1 { font-size: 1.8rem; text-align: center; }

    .instructions {
      max-width: 800px;
      text-align: center;
      font-size: 1rem;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 10px;
    }

    .game-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    /* BILD-CONTAINER */
    .image-container {
      position: relative;
      width: 600px;
      max-width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.3);
      background-image: url("assets/noel_scene.png"); /* <- hier dein Bild */
      background-size: cover;
      background-position: center;
      touch-action: none;
    }

    /* ZAHLEN */
    .target-number {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #c0182b;
      border: 2px solid #c0182b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      transform: translate(-50%, -50%);
      user-select: none;
    }

    .target-number.correct {
      background: #1f9152;
      color: #fff;
      border-color: #1f9152;
    }

    /* Wortkarten */
    .word-list {
      min-width: 240px;
      max-width: 360px;
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 12px;
    }

    .words { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

    .word-card {
      padding: 8px 12px;
      border-radius: 20px;
      background: #fff;
      color: #000;
      cursor: grab;
      touch-action: none;
      font-size: 0.95rem;
    }

    .word-card.used { opacity: 0.4; cursor: default; }

    /* Wort, das auf die richtige Stelle gesetzt wird */
    .placed-word {
      position: absolute;
      background: rgba(255,255,255,0.95);
      color: #000;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      transform: translate(-50%, -70%);
      pointer-events: none;
      white-space: nowrap;
    }

    .feedback { text-align: center; min-height: 1.2em; }
    .feedback.ok { color: #7cff9b; }
    .feedback.bad { color: #ff8c8c; }

    footer { opacity: 0.7; text-align: center; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header><h1>Día 10 – Palabras de Papá Noel</h1></header>

  <div class="instructions">
    Mira la imagen y arrastra cada palabra al número correcto.
  </div>

  <main class="game-layout">
    <section class="image-container" id="imageContainer"></section>

    <section class="word-list">
      <h2>Palabras</h2>
      <div class="words" id="wordList"></div>
      <div class="feedback" id="feedback"></div>
      <div class="status" id="status"></div>
    </section>
  </main>

  <footer>Consejo: Puedes repetir el juego.</footer>

  <script>
    /* ========= KONFIGURATION ========= */

    // Spanische Wörter
    const words = [
      { id: "Papá Noel",      label: "Papá Noel" },
      { id: "el ángel",      label: "el ángel" },
      { id: "la chimenea",       label: "la chimenea" },
      { id: "el árbol de Navidad",   label: "el árbol de Navidad" },
      { id: "el regalo navideño",    label: "el regalo navideño" },
      { id: "la bola de Navidad",     label: "la bola de Navidad" },
      { id: "la tarjeta de Navidad",      label: "la tarjeta de Navidad" },
      { id: "el cascanueces",      label: "el cascanueces" },
      { id: "la iluminación",    label: "la iluminación" },
      { id: "la corona de Navidad",      label: "la corona de Navidad" }
    ];

    // Zahlenpositionen x= links rechts y= hoch runter
    const targetsConfig = [
      { number: 1, x: 8,  y: 90,  correctWordId: "Papá Noel" },
      { number: 2, x: 55, y: 22, correctWordId: "el ángel" },
      { number: 3, x: 89, y: 20, correctWordId: "la corona de Navidad" },
      { number: 4, x: 60, y: 65, correctWordId: "la iluminación" },
      { number: 5, x: 55, y: 64, correctWordId: "el árbol de Navidad" },
      { number: 6, x: 10, y: 30, correctWordId: "la chimenea" },
      { number: 7, x: 90, y: 60, correctWordId: "el cascanueces" },
      { number: 8, x: 45, y: 75, correctWordId: "el regalo navideño" },
      { number: 9, x: 54, y: 55, correctWordId: "la bola de Navidad" },
      { number: 10, x: 30, y: 10, correctWordId: "la tarjeta de Navidad" }
    ];

    /* ========= SPIELVARIABLEN ========= */

    const imageContainer = document.getElementById("imageContainer");
    const wordListEl = document.getElementById("wordList");
    const feedbackEl = document.getElementById("feedback");
    const statusEl = document.getElementById("status");

    let correctCount = 0;
    let draggingCard = null;
    let dragClone = null;

    /* ========= ZIELE ERZEUGEN ========= */

    function initTargets() {
      targetsConfig.forEach(cfg => {
        const t = document.createElement("div");
        t.className = "target-number";
        t.style.left = cfg.x + "%";
        t.style.top = cfg.y + "%";
        t.textContent = cfg.number;
        t.dataset.correctWordId = cfg.correctWordId;
        t.dataset.number = cfg.number;
        imageContainer.appendChild(t);
      });
    }

    /* ========= WORTKÄRTCHEN ERZEUGEN ========= */

    function initWords() {
      words.forEach(w => {
        const card = document.createElement("div");
        card.className = "word-card";
        card.textContent = w.label;
        card.dataset.wordId = w.id;

        card.addEventListener("pointerdown", (e) => startDrag(e, card));
        wordListEl.appendChild(card);
      });
    }

    /* ========= DRAG START ========= */

    function startDrag(e, card) {
      if (card.classList.contains("used")) return;

      draggingCard = card;

      // "Ghost"-Kopie erzeugen
      dragClone = card.cloneNode(true);
      dragClone.style.position = "fixed";
      dragClone.style.left = e.clientX + "px";
      dragClone.style.top = e.clientY + "px";
      dragClone.style.transform = "translate(-50%, -50%)";
      dragClone.style.opacity = "0.9";
      dragClone.style.zIndex = "9999";
      dragClone.style.pointerEvents = "none";

      document.body.appendChild(dragClone);
    }

    /* ========= DRAG BEWEGEN ========= */

    function onPointerMove(e) {
      if (!dragClone) return;
      dragClone.style.left = e.clientX + "px";
      dragClone.style.top = e.clientY + "px";
    }

    /* ========= DRAG LOSLASSEN ========= */

    function onPointerUp(e) {
      if (!draggingCard) return;

      if (dragClone) dragClone.remove();

      const el = document.elementFromPoint(e.clientX, e.clientY);
      const target = el ? el.closest(".target-number") : null;

      if (target) dropOnTarget(draggingCard, target);

      draggingCard = null;
      dragClone = null;
    }

    /* ========= DROP-LOGIK ========= */

    function dropOnTarget(wordCard, target) {
      const correctId = target.dataset.correctWordId;
      const droppedId = wordCard.dataset.wordId;

      if (correctId !== droppedId) {
        feedbackEl.textContent = "No. Intenta otra vez.";
        feedbackEl.className = "feedback bad";
        return;
      }

      /* ========== RICHTIG! Wort soll an der Zielposition stehen bleiben ========== */

      target.classList.add("correct");
      wordCard.classList.add("used");

      // Wort an Zielposition anzeigen
      const placed = document.createElement("div");
      placed.className = "placed-word";
      placed.textContent = wordCard.textContent;

      // Position über der Zahl
      placed.style.left = target.style.left;
      placed.style.top = target.style.top;

      imageContainer.appendChild(placed);

      feedbackEl.textContent = "¡Muy bien!";
      feedbackEl.className = "feedback ok";

      correctCount++;
      updateStatus();
    }

    /* ========= STATUS ========= */

    function updateStatus() {
      statusEl.textContent = `Correctos: ${correctCount} / ${targetsConfig.length}`;

      if (correctCount === targetsConfig.length) {
        statusEl.innerHTML = `<span>¡Perfecto! Juego completo.</span>`;
      }
    }

    /* ========= EVENT-LISTENER ========= */

    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);

    initTargets();
    initWords();
    updateStatus();
  </script>
</body>
</html>
