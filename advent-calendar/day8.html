<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adventskalender – Weihnachts-Mathe-Rätsel</title>

  <style>
    /* ===================== FESTES HINTERGRUNDBILD ===================== */
    .background-fixed {
      position: fixed;
      inset: 0;
      background: url("assets/deinBild.jpg") center center / cover no-repeat;
      z-index: -2;
    }

    /* ===================== FALLING COLORED NUMBERS ===================== */
    .numbers-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .num-fall {
      position: absolute;
      top: -10%;
      font-size: 1.4rem;
      font-weight: 800;
      text-shadow: 0 0 6px rgba(0,0,0,0.35);
      animation: fall linear infinite;
      user-select: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.6; }
    }

    /* ===================== SEITENLAYOUT ===================== */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1f2937;
      overflow-x: hidden;
      position: relative;
      z-index: 0;
    }

    header {
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.35);
      padding: 1.25rem 1rem .25rem;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .page {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 1.25rem;
    }

    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      padding: 1.5rem 1.25rem;
    }

    /* ===================== STEUERUNG ===================== */
    .controls{
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      margin:.75rem 0 1.25rem;
      justify-content:center;
    }

    .btn{
      border:none;
      background:linear-gradient(90deg, #22c55e, #16a34a);
      color:#fff;
      padding:.6rem 1rem;
      border-radius:999px;
      cursor:pointer;
      box-shadow:0 8px 16px rgba(22,163,74,.25);
      font-weight:700;
    }

    .btn.sec{
      background:#e11d48;
      box-shadow:0 8px 16px rgba(225,29,72,.25);
    }

    .message{
      margin:.6rem 0;
      text-align:center;
      font-weight:700;
      min-height:1.5em;
    }

    .message.ok{ color:#16a34a; }
    .message.err{ color:#e11d48; }

    .letter-box{
      text-align:center;
      margin-top:.75rem;
    }

    .letter{
      display:inline-block;
      font-weight:900;
      font-size:clamp(2rem, 6vw, 3.5rem);
      padding:.35rem 1rem;
      border-radius:14px;
      background:#0ea5e9;
      color:#fff;
      box-shadow:0 6px 14px rgba(14,165,233,.35);
    }

    /* ===================== MATHE-RÄTSEL ===================== */
    .puzzle-header{
      text-align:center;
      margin-bottom:1.25rem;
    }

    .puzzle-header h2{
      margin:.1rem 0;
      font-size:clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing:.06em;
      color:#b91c1c;
      text-transform:uppercase;
      font-weight:800;
    }

    .puzzle {
      max-width:480px;
      margin:0 auto;
      border-radius:18px;
      padding:1.2rem;
      border:6px solid #f97373;
      background: repeating-linear-gradient(45deg, #fee2e2 0 10px, #fee2e2 10px, #fca5a5 10px 20px);
    }

    .puzzle-inner{
      border-radius:12px;
      background:#fff;
      padding:1.25rem .75rem;
    }

    .equation{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.4rem;
      font-size:1.4rem;
      margin:.45rem 0;
      flex-wrap:wrap;
    }

    .symbol{
      width:40px;
      height:40px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.6rem;
      background:#f9fafb;
      box-shadow:0 2px 4px rgba(0,0,0,.08);
    }

    .ball{ background:#bbf7d0; }
    .gift{ background:#fecaca; }
    .sock{ background:#fef3c7; border-radius:12px; }

    .final input{
      width:80px;
      padding:.2rem .4rem;
      font-size:1.3rem;
      text-align:center;
      border-radius:8px;
      border:1px solid #cbd5e1;
    }
  </style>
</head>

<body>

  <!-- FESTES HINTERGRUNDBILD -->
  <div class="background-fixed"></div>

  <!-- FALLENDE ZAHLEN -->
  <div class="numbers-layer" id="numbersLayer"></div>

  <header>Tag 1 – Weihnachts-Mathe-Rätsel</header>

  <div class="page">
    <div class="card">

      <div class="puzzle-header">
        <h2>Merry Christmas</h2>
        <p>Kannst du dieses Mathe-Puzzle lösen?</p>
      </div>

      <div class="puzzle">
        <div class="puzzle-inner">

          <div class="equation">
            <div class="symbol ball">🎄</div>
            <span>+</span>
            <div class="symbol ball">🎄</div>
            <span>+</span>
            <div class="symbol ball">🎄</div>
            <span>= 6</span>
          </div>

          <div class="equation">
            <div class="symbol ball">🎄</div>
            <span>+</span>
            <div class="symbol ball">🎄</div>
            <span>+</span>
            <div class="symbol gift">🎁</div>
            <span>= 16</span>
          </div>

          <div class="equation">
            <div class="symbol sock">🧦</div>
            <span>+</span>
            <div class="symbol sock">🧦</div>
            <span>+</span>
            <div class="symbol gift">🎁</div>
            <span>= 20</span>
          </div>

          <div class="equation final">
            <div class="symbol sock">🧦</div>
            <span>+</span>
            <div class="symbol ball">🎄</div>
            <span>+</span>
            <div class="symbol gift">🎁</div>
            <span>=</span>
            <input id="answer" type="number">
          </div>

        </div>
      </div>

      <div class="controls">
        <button class="btn" id="checkBtn">Überprüfen</button>
        <button class="btn sec" id="clearBtn">Alles löschen</button>
      </div>

      <div id="msg" class="message"></div>

      <div class="letter-box" id="letterBox" style="display:none;">
        <p>Dein Buchstabe:</p>
        <div class="letter">O</div>
      </div>

    </div>
  </div>

  <script>
    /* ===================== Mathe-Logik ===================== */
    const CORRECT_ANSWER = 18;
    const answerInput = document.getElementById("answer");
    const msg = document.getElementById("msg");
    const letterBox = document.getElementById("letterBox");

    document.getElementById("checkBtn").addEventListener("click", () => {
      const val = Number(answerInput.value.trim());
      msg.classList.remove("ok", "err");

      if (!answerInput.value.trim()) {
        msg.textContent = "Bitte gib eine Zahl ein.";
        msg.classList.add("err");
        return;
      }

      if (val === CORRECT_ANSWER) {
        msg.textContent = "Super, das stimmt! 🎉";
        msg.classList.add("ok");
        letterBox.style.display = "block";
      } else {
        msg.textContent = "Leider falsch. Versuch es nochmal!";
        msg.classList.add("err");
        letterBox.style.display = "none";
      }
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      answerInput.value = "";
      msg.textContent = "";
      msg.classList.remove("ok", "err");
      letterBox.style.display = "none";
    });

    /* ===================== Fallende bunte Zahlen ===================== */
    const layer = document.getElementById("numbersLayer");
    const COLORS = ["#ef4444","#22c55e","#facc15","#3b82f6","#ffffff"];

    function createNumber() {
      const elem = document.createElement("div");
      elem.className = "num-fall";
      elem.textContent = Math.floor(Math.random()*10);
      elem.style.left = Math.random()*100 + "vw";
      elem.style.animationDuration = 6 + Math.random()*6 + "s";
      elem.style.fontSize = (1 + Math.random()*1.8) + "rem";
      elem.style.color = COLORS[Math.floor(Math.random()*COLORS.length)];
      elem.style.opacity = 0.6 + Math.random()*0.4;
      layer.appendChild(elem);
      setTimeout(()=>elem.remove(),14000);
    }

    for (let i=0;i<40;i++) setTimeout(createNumber, i*150);
    setInterval(createNumber, 700);
  </script>

</body>
</html>
